# Production: nothing is built here, the app image comes ready from GHCR.
# APP_TAG picks the version: latest (default), v0.6.0, or a commit sha for a rollback.
services:
  app:
    image: ghcr.io/lpkop/devops-labs-fn371223037:${APP_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_TAG:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
